name: Manual Linux 0.6.0 native Debian QA
# Authorized operator stages one private draft bundle. This workflow never publishes.
# Bundle root: prepackaged/MischiefPet-linux-{x64,arm64}, source/{desktop,src,
# assets,tools,tests,package.json,package-lock.json,index.html,source-freeze.json},
# old-debs/mischief-pet_0.5.1_{amd64,arm64}.deb, icon.png. No credentials.
# Only exercised checks can pass. Natural hangs stay separate from disclosed
# controlled real-kernel SIGALRM drills and mandatory POSIX unit integration.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Private draft release holding the QA bundle
        required: true
        type: string
      bundle_asset:
        description: Exact privately staged QA bundle filename ending in .tar.gz
        required: true
        type: string
      bundle_sha256:
        description: Exact lowercase SHA256 of the QA bundle
        required: true
        type: string
      freeze_sha256:
        description: Exact SHA256 of the source-freeze manifest used by this run
        required: true
        type: string
      expected_version:
        description: Exact app version under test
        required: true
        type: string
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  BUNDLE_ASSET: ${{ inputs.bundle_asset }}
  BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
  FREEZE_SHA256: ${{ inputs.freeze_sha256 }}
  EXPECTED_VERSION: ${{ inputs.expected_version }}
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  CI: 'true'
jobs:
  native-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NATIVE_ARCH: x64
      DEBIAN_ARCH: amd64
      KERNEL_ARCH: x86_64
    steps: &native-steps
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare command receipts and isolated desktop harness
        id: harness
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/mischief-qa"
          mkdir -p "$root/tools" "$root/evidence/commands" "$root/evidence/packages" "$root/download" "$root/bundle"
          printf 'QA_ROOT=%s\nQA_TOOLS=%s\nQA_EVIDENCE=%s\nQA_BUNDLE=%s\nQA_SOURCE=%s\n' "$root" "$root/tools" "$root/evidence" "$root/bundle" "$root/bundle/source" >> "$GITHUB_ENV"
          cat > "$root/tools/record-command.cjs" <<'COMMAND'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),{spawn}=require('node:child_process');
          const args=process.argv.slice(2),directory=args.shift(),allowExit1=args[0]==='--allow-exit-1';
          if(allowExit1)args.shift();
          if(!args.length)throw Error('Command required');
          const output=fs.mkdtempSync(path.join(directory,'command-'));
          const receipt={command:args,cwd:process.cwd(),started_at:new Date().toISOString(),allowed_exit_codes:allowExit1?[0,1]:[0]};
          const started=performance.now(),child=spawn(args[0],args.slice(1),{stdio:['ignore','pipe','pipe']});
          let stdout='',stderr='';
          child.stdout.on('data',b=>{stdout+=b;process.stdout.write(b);});
          child.stderr.on('data',b=>{stderr+=b;process.stderr.write(b);});
          child.on('error',e=>{receipt.spawn_error=e.message;});
          const signals=[];
          for(const signal of ['SIGINT','SIGTERM'])process.on(signal,()=>{signals.push({signal,at:new Date().toISOString()});child.kill(signal);});
          child.on('close',(code,signal)=>{
            Object.assign(receipt,{exit_code:code,signal,forwarded_signals:signals,elapsed_ms:performance.now()-started,finished_at:new Date().toISOString(),stdout,stderr});
            for(const [name,text] of [['stdout',stdout],['stderr',stderr]]){
              fs.writeFileSync(path.join(output,name+'.log'),text);
              receipt[name+'_sha256']=crypto.createHash('sha256').update(text).digest('hex');
            }
            fs.writeFileSync(path.join(output,'command.json'),JSON.stringify(receipt,null,2)+'\n');
            if(receipt.spawn_error||signals.length||signal)process.exitCode=1;
            else process.exitCode=code===0||(allowExit1&&code===1)?0:(code===null?1:code);
          });
          COMMAND
          cat > "$root/tools/common.sh" <<'COMMON'
          set -euo pipefail
          run() { node "$QA_TOOLS/record-command.cjs" "$QA_EVIDENCE/commands" "$@"; }
          session() { run xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' dbus-run-session -- bash "$QA_TOOLS/x11-session.sh" "$@"; }
          COMMON
          cat > "$root/tools/openbox.xml" <<'WM'
          <?xml version="1.0"?><openbox_config xmlns="http://openbox.org/3.4/rc"><theme><name>Onyx</name><titleLayout>NLIMC</titleLayout></theme><focus><focusNew>no</focusNew><followMouse>no</followMouse></focus><desktops><number>1</number></desktops></openbox_config>
          WM
          cat > "$root/tools/x11-session.sh" <<'SESSION'
          set -euo pipefail
          ulimit -c 0
          unset ELECTRON_RUN_AS_NODE ELECTRON_DISABLE_SANDBOX CHROME_DEVEL_SANDBOX
          openbox --config-file "$QA_TOOLS/openbox.xml" & wm=$!
          xcompmgr -n & compositor=$!
          trap 'kill "$compositor" "$wm" 2>/dev/null || true; wait "$compositor" "$wm" 2>/dev/null || true' EXIT
          sleep 1
          feh --bg-fill "$QA_TOOLS/wallpaper.png"
          "$@"
          SESSION
          cat > "$root/tools/verify-source.cjs" <<'VERIFY'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const root=process.env.QA_SOURCE,file=path.join(root,'source-freeze.json'),rows=[];
          const hash=f=>crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          const receipt={result:'FAIL',freeze_sha256:hash(file),expected_freeze_sha256:process.env.FREEZE_SHA256,files:rows};
          try{
            assert.equal(receipt.freeze_sha256,process.env.FREEZE_SHA256);
            const freeze=JSON.parse(fs.readFileSync(file,'utf8'));
            assert.equal(freeze.version,process.env.EXPECTED_VERSION);
            assert.ok(Object.keys(freeze.files).length>0);
            for(const [relative,expected] of Object.entries(freeze.files)){
              assert.ok(!path.isAbsolute(relative)&&!relative.split(/[\\/]/).includes('..'));
              const full=path.join(root,relative),present=fs.existsSync(full)&&fs.statSync(full).isFile(),actual=present?hash(full):null,bytes=present?fs.statSync(full).size:null,expected_sha256=typeof expected==='string'?expected:expected?.sha256,expected_bytes=typeof expected==='object'?expected?.bytes:null;
              rows.push({path:relative,expected_sha256,sha256:actual,expected_bytes,bytes,result:present&&actual===expected_sha256&&(expected_bytes===null||bytes===expected_bytes)?'PASS':'FAIL'});
              assert.equal(rows.at(-1).result,'PASS',relative);
            }
            assert.equal(JSON.parse(fs.readFileSync(path.join(root,'package.json'),'utf8')).version,process.env.EXPECTED_VERSION);
            receipt.result='PASS';
          }catch(e){receipt.error=e.stack;process.exitCode=1;}
          fs.writeFileSync(path.join(process.env.QA_EVIDENCE,'source-freeze-'+(process.argv[2]||'initial')+'.json'),JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          VERIFY
          cat > "$root/tools/assert-removed.cjs" <<'ABSENT'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const paths=['/opt/mischief-pet/MischiefPet','/opt/Mischief Pet/MischiefPet','/etc/apparmor.d/MischiefPet','/usr/share/applications/MischiefPet.desktop','/etc/alternatives/MischiefPet','/usr/bin/MischiefPet'];
          const rows=paths.map(file=>{let exists=true;try{fs.lstatSync(file);}catch(e){if(e.code==='ENOENT')exists=false;else throw e;}return {path:file,exists};});
          console.log(JSON.stringify({removed_paths:rows}));assert.ok(rows.every(r=>!r.exists),'Package integration remains');
          ABSENT
          cat > "$root/tools/clean-package.sh" <<'CLEAN'
          source "$QA_TOOLS/common.sh"
          status="$(run --allow-exit-1 dpkg-query -W '-f=${Status}\n' mischief-pet)"
          if [[ "$status" =~ (installed|unpacked|half-installed|half-configured|triggers-awaited|triggers-pending)$ ]]; then
            run sudo -n env DEBIAN_FRONTEND=noninteractive apt-get remove -y mischief-pet
          fi
          run node "$QA_TOOLS/assert-removed.cjs"
          census="$(run --allow-exit-1 ps -C MischiefPet,chrome_crashpad -o pid=,ppid=,comm=)"
          test -z "$census"
          CLEAN
          cat > "$root/tools/host.cjs" <<'HOST'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          const keys=['kernel.apparmor_restrict_unprivileged_userns','kernel.unprivileged_userns_clone'];
          const receipt={platform:process.platform,node_arch:process.arch,node_version:process.version,kernel_arch:execFileSync('uname',['-m'],{encoding:'utf8'}).trim(),debian_arch:execFileSync('dpkg',['--print-architecture'],{encoding:'utf8'}).trim(),os_release:fs.readFileSync('/etc/os-release','utf8'),sysctls:Object.fromEntries(keys.map(key=>[key,execFileSync('sysctl',['-n',key],{encoding:'utf8'}).trim()]))};
          fs.writeFileSync(path.join(process.env.QA_EVIDENCE,'host-original.json'),JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt));
          assert.equal(receipt.platform,'linux');assert.equal(receipt.node_arch,process.env.NATIVE_ARCH);assert.equal(receipt.kernel_arch,process.env.KERNEL_ARCH);assert.equal(receipt.debian_arch,process.env.DEBIAN_ARCH);
          assert.match(receipt.os_release,/^ID=ubuntu$/m);assert.match(receipt.os_release,/^VERSION_ID="24\.04"$/m);
          for(const value of Object.values(receipt.sysctls))assert.match(value,/^[01]$/);
          HOST
      - name: Capture original native host and install desktop dependencies
        id: desktop
        run: |
          source "$QA_TOOLS/common.sh"
          run node "$QA_TOOLS/host.cjs"
          run sudo -n apt-get update
          run sudo -n apt-get install -y --no-install-recommends xvfb openbox xcompmgr feh imagemagick dbus-x11 apparmor libgtk-3-0t64 libnss3 libxss1 libasound2t64 libgbm1 libatk-bridge2.0-0t64 libdrm2 libx11-6
          run sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          run sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          run sudo -n aa-status
          run convert -size 1920x1080 xc:'#E9EFEA' "$QA_TOOLS/wallpaper.png"
          run bash "$QA_TOOLS/clean-package.sh"
      - name: Download the exact private draft bundle and verify frozen source
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source "$QA_TOOLS/common.sh"
          [[ "$BUNDLE_ASSET" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.tar\.gz$ ]]
          [[ "$BUNDLE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          run gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json tagName,isDraft --jq '{tagName: .tagName, isDraft: .isDraft}' > "$QA_EVIDENCE/draft.json"
          node -e 'const assert=require("node:assert/strict"),r=require(process.argv[1]);assert.equal(r.isDraft,true);assert.equal(r.tagName,process.env.RELEASE_TAG)' "$QA_EVIDENCE/draft.json"
          run gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --pattern "$BUNDLE_ASSET" --dir "$QA_ROOT/download"
          cat > "$QA_TOOLS/verify-bundle.cjs" <<'BUNDLE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const file=path.join(process.env.QA_ROOT,'download',process.env.BUNDLE_ASSET),sha=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const receipt={asset:process.env.BUNDLE_ASSET,release_tag:process.env.RELEASE_TAG,sha256:sha,expected_sha256:process.env.BUNDLE_SHA256,bytes:fs.statSync(file).size,result:sha===process.env.BUNDLE_SHA256?'PASS':'FAIL'};
          fs.writeFileSync(path.join(process.env.QA_EVIDENCE,'bundle-identity.json'),JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt));assert.equal(sha,process.env.BUNDLE_SHA256);
          BUNDLE
          run node "$QA_TOOLS/verify-bundle.cjs"
          run tar -tzf "$QA_ROOT/download/$BUNDLE_ASSET" > "$QA_EVIDENCE/bundle-members.txt"
          node -e 'const fs=require("node:fs"),assert=require("node:assert/strict");for(const p of fs.readFileSync(process.argv[1],"utf8").trim().split("\n")){assert.ok(!p.startsWith("/")&&!p.split("/").includes(".."),p)}' "$QA_EVIDENCE/bundle-members.txt"
          run tar --no-same-owner -xzf "$QA_ROOT/download/$BUNDLE_ASSET" -C "$QA_BUNDLE"
          for arch in x64 arm64; do test -x "$QA_BUNDLE/prepackaged/MischiefPet-linux-$arch/MischiefPet"; test -f "$QA_BUNDLE/prepackaged/MischiefPet-linux-$arch/resources/app.asar"; done
          for arch in amd64 arm64; do test -f "$QA_BUNDLE/old-debs/mischief-pet_0.5.1_$arch.deb"; done
          for dir in desktop src assets tools tests; do test -d "$QA_SOURCE/$dir"; done
          for file in package.json package-lock.json index.html source-freeze.json; do test -f "$QA_SOURCE/$file"; done
          test -f "$QA_BUNDLE/icon.png"
          run node "$QA_TOOLS/verify-source.cjs" initial
          run sha256sum "$QA_SOURCE/tools/package-linux-deb.cjs" "$QA_SOURCE/tools/linux-sandbox-qa.cjs" "$QA_SOURCE/tools/quit-qa-posix.cjs" "$QA_SOURCE/tools/linux-upgrade-suid-qa.cjs" "$QA_SOURCE/tools/qa-posix-inspector.cjs" "$QA_SOURCE/tests/quit-watchdog.test.cjs" > "$QA_EVIDENCE/helper-sha256.txt"
          printf '%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$NATIVE_ARCH" > "$QA_EVIDENCE/run-identity.txt"
      - name: Install frozen dependencies on this native architecture
        id: dependencies
        run: |
          source "$QA_TOOLS/common.sh"
          cd "$QA_SOURCE"
          run npm ci --no-audit --no-fund
          run node "$QA_TOOLS/verify-source.cjs" after-npm-ci
      - name: Require real POSIX watchdog integration RAN and PASS with zero skips
        id: watchdog
        run: |
          source "$QA_TOOLS/common.sh"
          cd "$QA_SOURCE"
          watchdog_status=0
          run node --test --test-reporter=tap tests/quit-watchdog.test.cjs > "$QA_EVIDENCE/quit-watchdog.tap" || watchdog_status=$?
          cat > "$QA_TOOLS/assert-watchdog.cjs" <<'WATCHDOG'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const tap=fs.readFileSync(path.join(process.env.QA_EVIDENCE,'quit-watchdog.tap'),'utf8');
          const name='real POSIX watchdog signal kills a stalled child and allows a normal child to exit';
          const row=tap.split('\n').find(line=>new RegExp('^ok \\d+ - '+name+'(?:\\s|$)').test(line));
          const receipt={integration:name,ran:!!row&&!/#\s*(?:SKIP|TODO)/i.test(row),result:'FAIL',skipped:Number(/^# skipped (\d+)$/m.exec(tap)?.[1]??-1),failed:Number(/^# fail (\d+)$/m.exec(tap)?.[1]??-1)};
          try{assert.ok(receipt.ran,'Real POSIX integration did not RAN/PASS');assert.equal(receipt.skipped,0);assert.equal(receipt.failed,0);receipt.result='PASS';}catch(e){receipt.error=e.stack;process.exitCode=1;}
          receipt.execution=receipt.ran?'RAN':'NOT_EXERCISED';
          fs.writeFileSync(path.join(process.env.QA_EVIDENCE,'watchdog-integration.json'),JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt));
          WATCHDOG
          run node "$QA_TOOLS/assert-watchdog.cjs" || watchdog_status=1
          exit "$watchdog_status"
      - name: Bind prepackaged runtime bytes to the approved frozen source
        id: provenance
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          source "$QA_TOOLS/common.sh"
          mkdir -p "$QA_SOURCE/build"
          run ln -s "$QA_BUNDLE/prepackaged/MischiefPet-linux-$NATIVE_ARCH" "$QA_SOURCE/build/MischiefPet-linux-$NATIVE_ARCH"
          cd "$QA_SOURCE"
          run node tools/verify-package-source.cjs
          run cp "$QA_SOURCE/build/package-source-linux-$NATIVE_ARCH.json" "$QA_EVIDENCE/package-source.json"
          node -e 'const assert=require("node:assert/strict"),r=require(process.argv[1]);assert.equal(r.result,"PASS");assert.ok(r.files.length>0);assert.equal(r.platform,"linux");assert.equal(r.arch,process.env.NATIVE_ARCH)' "$QA_EVIDENCE/package-source.json"
      - name: Build only the matching native Debian package from prepackaged bytes
        id: packages
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.provenance.outcome == 'success' }}
        run: |
          source "$QA_TOOLS/common.sh"
          run node "$QA_SOURCE/tools/package-linux-deb.cjs" "$QA_BUNDLE/prepackaged/MischiefPet-linux-$NATIVE_ARCH" "$NATIVE_ARCH" "$QA_EVIDENCE/packages" "$QA_BUNDLE/icon.png"
          new="$QA_EVIDENCE/packages/mischief-pet_${EXPECTED_VERSION}_$DEBIAN_ARCH.deb"
          old="$QA_BUNDLE/old-debs/mischief-pet_0.5.1_$DEBIAN_ARCH.deb"
          run sha256sum "$new" "$old" "$QA_BUNDLE/icon.png" "$QA_BUNDLE/prepackaged/MischiefPet-linux-$NATIVE_ARCH/resources/app.asar" > "$QA_EVIDENCE/package-input-sha256.txt"
          for package in "$old" "$new"; do
            run dpkg-deb --field "$package" Package Version Architecture
            run dpkg-deb -I "$package"
            run dpkg-deb -c "$package"
          done
          run dpkg-deb -e "$new" "$QA_EVIDENCE/control-$DEBIAN_ARCH"
          test "$(dpkg-deb --field "$new" Package)" = mischief-pet
          test "$(dpkg-deb --field "$new" Version)" = "$EXPECTED_VERSION"
          test "$(dpkg-deb --field "$new" Architecture)" = "$DEBIAN_ARCH"
      - name: Export candidate bytes only to the checked private QA draft
        id: export
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source "$QA_TOOLS/common.sh"
          run gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json tagName,isDraft --jq '{tagName: .tagName, isDraft: .isDraft}' > "$QA_EVIDENCE/draft-before-export.json"
          node -e 'const assert=require("node:assert/strict"),r=require(process.argv[1]);assert.equal(r.isDraft,true);assert.equal(r.tagName,process.env.RELEASE_TAG)' "$QA_EVIDENCE/draft-before-export.json"
          run gh release upload "$RELEASE_TAG" "$QA_EVIDENCE/packages/mischief-pet_${EXPECTED_VERSION}_$DEBIAN_ARCH.deb" -R "$GITHUB_REPOSITORY" --clobber
      - name: Install the new package for ordinary native sandbox and quit QA
        id: install
        if: ${{ !cancelled() && steps.packages.outcome == 'success' && steps.desktop.outcome == 'success' }}
        run: |
          source "$QA_TOOLS/common.sh"
          run bash "$QA_TOOLS/clean-package.sh"
          run sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y "$QA_EVIDENCE/packages/mischief-pet_${EXPECTED_VERSION}_$DEBIAN_ARCH.deb"
          run stat -c '%U:%G %a %n' /opt/mischief-pet/chrome-sandbox
          test "$(stat -c '%u:%g:%a' /opt/mischief-pet/chrome-sandbox)" = 0:0:4755
          run cat /etc/apparmor.d/MischiefPet /usr/share/applications/MischiefPet.desktop
          run update-alternatives --query MischiefPet
          run sudo -n aa-status
          run sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Run the existing eight native Chromium sandbox checks
        id: sandbox
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          source "$QA_TOOLS/common.sh"
          # Existing helper has no expected-version argument or hardcoded version.
          # The quit phase below independently enforces the installed expected version.
          session node "$QA_SOURCE/tools/linux-sandbox-qa.cjs" /opt/mischief-pet/MischiefPet "$QA_EVIDENCE/sandbox"
          cat > "$QA_TOOLS/assert-sandbox.cjs" <<'SANDBOX'
          const assert=require('node:assert/strict'),r=require(process.env.QA_EVIDENCE+'/sandbox/qa.json');
          assert.equal(r.result,'PASS_SANDBOXED');assert.equal(r.checks.length,8);assert.ok(r.checks.every(c=>c.result==='PASS'));console.log(JSON.stringify({result:r.result,native_checks:r.checks.length}));
          SANDBOX
          run node "$QA_TOOLS/assert-sandbox.cjs"
      - name: Run five installed whole-tree quits and immediate same-profile relaunches
        id: quits
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          source "$QA_TOOLS/common.sh"
          session node "$QA_SOURCE/tools/quit-qa-posix.cjs" /opt/mischief-pet/MischiefPet "$QA_EVIDENCE/quits" "$EXPECTED_VERSION"
      - name: Exercise real Electron SIGALRM whole trees and immediate apt removal
        id: watchdog-tree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          source "$QA_TOOLS/common.sh"
          session node "$QA_SOURCE/tools/quit-qa-posix.cjs" /opt/mischief-pet/MischiefPet "$QA_EVIDENCE/watchdog-tree" "$EXPECTED_VERSION" --watchdog-drill --remove-deb-after-watchdog
      - name: Remove the ordinary installed package before the fresh upgrade phase
        id: remove-ordinary
        if: ${{ always() && steps.harness.outcome == 'success' }}
        run: |
          source "$QA_TOOLS/common.sh"
          run bash "$QA_TOOLS/clean-package.sh"
      - name: Fresh package phase for real 0.5.1 to 0.6.0 upgrade and save preservation
        id: upgrade
        if: ${{ !cancelled() && steps.packages.outcome == 'success' && steps.desktop.outcome == 'success' && steps.remove-ordinary.outcome == 'success' }}
        run: |
          source "$QA_TOOLS/common.sh"
          run bash "$QA_TOOLS/clean-package.sh"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          session node "$QA_SOURCE/tools/linux-upgrade-suid-qa.cjs" upgrade --old-deb "$QA_BUNDLE/old-debs/mischief-pet_0.5.1_$DEBIAN_ARCH.deb" --new-deb "$QA_EVIDENCE/packages/mischief-pet_${EXPECTED_VERSION}_$DEBIAN_ARCH.deb" --old-version 0.5.1 --new-version "$EXPECTED_VERSION" --cleanup remove --output "$QA_EVIDENCE/upgrade" --disposable-runner
      - name: Ensure removal between upgrade and fresh SUID fallback phase
        id: remove-upgrade
        if: ${{ always() && steps.harness.outcome == 'success' }}
        run: |
          source "$QA_TOOLS/common.sh"
          run bash "$QA_TOOLS/clean-package.sh"
          run sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone
      - name: Fresh package phase for genuinely denied userns and installed SUID fallback
        id: suid
        if: ${{ !cancelled() && steps.packages.outcome == 'success' && steps.desktop.outcome == 'success' && steps.remove-upgrade.outcome == 'success' }}
        run: |
          source "$QA_TOOLS/common.sh"
          run bash "$QA_TOOLS/clean-package.sh"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          session node "$QA_SOURCE/tools/linux-upgrade-suid-qa.cjs" suid --new-deb "$QA_EVIDENCE/packages/mischief-pet_${EXPECTED_VERSION}_$DEBIAN_ARCH.deb" --new-version "$EXPECTED_VERSION" --cleanup remove --output "$QA_EVIDENCE/suid" --disposable-runner
      - name: Always remove package integration and restore original host sysctls
        id: cleanup
        if: ${{ always() && steps.harness.outcome == 'success' }}
        run: |
          source "$QA_TOOLS/common.sh"
          # Run both cleanup operations even if either fails; never mask the failure.
          cleanup_status=0
          run bash "$QA_TOOLS/clean-package.sh" || cleanup_status=1
          if test -f "$QA_EVIDENCE/host-original.json"; then
            for key in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone; do
              original="$(node -e 'process.stdout.write(require(process.argv[1]).sysctls[process.argv[2]])' "$QA_EVIDENCE/host-original.json" "$key")"
              run sudo -n sysctl -w "$key=$original" || cleanup_status=1
              run sysctl "$key" || cleanup_status=1
              test "$(sysctl -n "$key")" = "$original" || cleanup_status=1
            done
          fi
          exit "$cleanup_status"
      - name: Always record final acceptance, limits and exact evidence hashes
        if: ${{ always() }}
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mischief-qa/evidence"
          cat > "$RUNNER_TEMP/mischief-qa/final-evidence.cjs" <<'FINAL'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),{execFileSync}=require('node:child_process');
          const root=path.join(process.env.RUNNER_TEMP,'mischief-qa'),evidence=path.join(root,'evidence');
          const read=f=>{try{return JSON.parse(fs.readFileSync(path.join(evidence,f),'utf8'));}catch{return null;}};
          const steps=JSON.parse(process.env.STEP_OUTCOMES),quits=read('quits/quit-qa.json'),drill=read('watchdog-tree/quit-qa.json'),upgrade=read('upgrade/qa.json'),suid=read('suid/qa.json');
          const required=['harness','desktop','bundle','dependencies','watchdog','provenance','packages','export','install','sandbox','quits','watchdog-tree','remove-ordinary','upgrade','remove-upgrade','suid','cleanup'];
          const checks=required.map(name=>({name,result:steps[name]?.outcome==='success'?'PASS':'FAIL',outcome:steps[name]?.outcome||'NOT_EXERCISED'}));
          checks.push({name:'Five versioned quits and immediate relaunches',result:quits?.version===process.env.EXPECTED_VERSION&&quits.result==='PASS'&&quits.passed===5&&quits.runs?.length===5&&quits.runs.every(r=>r.result==='PASS'&&r.quit?.on_main_exit?.result==='PASS')?'PASS':'FAIL'});
          checks.push({name:'Five genuine source-alarm SIGALRM whole trees and immediate apt removal',result:drill?.controlled_watchdog_drill===true&&drill.result==='PASS'&&drill.passed===5&&drill.runs?.length===5&&drill.runs.every(r=>r.quit?.signal==='SIGALRM'&&r.quit.whole_tree_exit_ms<=4000&&r.quit.on_main_exit?.result==='PASS')&&drill.runs[4].quit.on_main_exit?.kind==='IMMEDIATE_APT_REMOVE'&&drill.runs[4].quit.on_main_exit.removal?.exit_code===0?'PASS':'FAIL'});
          for(const [name,r] of [['upgrade',upgrade],['suid',suid]])checks.push({name:name+' exercised checks and cleanup',result:r?.result==='PASS_EXERCISED_CHECKS'&&r.checks?.length>0&&r.checks.every(c=>c.result==='PASS')&&r.cleanup?.every(c=>!c.result||c.result==='PASS')?'PASS':'FAIL'});
          const naturalRemoval=suid?.natural_sigalrm_removal||{result:'NOT_EXERCISED',reason:'SUID helper did not reach the conditional observation'};
          const limits=[{name:'Natural installed-app SIGALRM quit/relaunch',result:quits?.natural_watchdog_branch_observed?'OBSERVED_SEE_RECEIPTS':'NOT_EXERCISED',reason:'Controlled will-quit stalls are disclosed separately from natural product hangs.'},{name:'Immediate apt removal after natural SIGALRM',...naturalRemoval},{name:'Desktop fidelity',result:'LIMITED',reason:'Native GitHub-hosted Ubuntu 24.04 Xvfb/Openbox, not physical desktop, Wayland, multimonitor or extended soak.'}];
          const sysctls={};for(const key of ['kernel.apparmor_restrict_unprivileged_userns','kernel.unprivileged_userns_clone'])try{sysctls[key]=execFileSync('sysctl',['-n',key],{encoding:'utf8'}).trim();}catch(e){sysctls[key]={error:e.message};}
          const result=checks.every(c=>c.result==='PASS')?'PASS_EXERCISED_CHECKS':'FAIL';
          const receipt={finished_at:new Date().toISOString(),result,arch:process.env.NATIVE_ARCH,expected_version:process.env.EXPECTED_VERSION,bundle_sha256:process.env.BUNDLE_SHA256,freeze_sha256:process.env.FREEZE_SHA256,checks,limitations:limits,final_sysctls:sysctls};
          fs.writeFileSync(path.join(evidence,'final-acceptance.json'),JSON.stringify(receipt,null,2)+'\n');
          const tools=path.join(root,'tools');if(fs.existsSync(tools))fs.cpSync(tools,path.join(evidence,'workflow-harness'),{recursive:true});
          const hashes=[];function visit(dir){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const file=path.join(dir,entry.name);if(entry.isDirectory())visit(file);else if(entry.isFile())hashes.push({path:path.relative(evidence,file),bytes:fs.statSync(file).size,sha256:crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')});}}
          visit(evidence);fs.writeFileSync(path.join(evidence,'evidence-sha256.json'),JSON.stringify({files:hashes},null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));if(result==='FAIL')process.exitCode=1;
          FINAL
          node "$RUNNER_TEMP/mischief-qa/final-evidence.cjs"
      - name: Upload receipts and screenshots only, never candidate application bytes
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-051-${{ env.NATIVE_ARCH }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mischief-qa/evidence/
            !${{ runner.temp }}/mischief-qa/evidence/packages/*.deb
          if-no-files-found: error
          retention-days: 7
  native-arm64:
    needs: native-x64
    # Sequential even after an x64 QA failure, to preserve complete native evidence.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      NATIVE_ARCH: arm64
      DEBIAN_ARCH: arm64
      KERNEL_ARCH: aarch64
    steps: *native-steps
