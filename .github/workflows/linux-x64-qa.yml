name: Manual Linux Debian sandbox QA
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Private draft release holding unchanged Linux archives and product icon
        required: true
        type: string
      asset_x64:
        description: Original Linux x64 tar.gz asset
        required: true
        type: string
      sha256_x64:
        description: Expected SHA256 of the x64 archive
        required: true
        type: string
      asset_arm64:
        description: Original Linux arm64 tar.gz asset
        required: true
        type: string
      sha256_arm64:
        description: Expected SHA256 of the arm64 archive
        required: true
        type: string
      icon_asset:
        description: Existing product icon PNG asset
        required: true
        type: string
      icon_sha256:
        description: Expected SHA256 of the icon
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  native-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      sha256_arm64: ${{ steps.packages.outputs.sha256_arm64 }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      ASSET_X64: ${{ inputs.asset_x64 }}
      SHA256_X64: ${{ inputs.sha256_x64 }}
      ASSET_ARM64: ${{ inputs.asset_arm64 }}
      SHA256_ARM64: ${{ inputs.sha256_arm64 }}
      ICON_ASSET: ${{ inputs.icon_asset }}
      ICON_SHA256: ${{ inputs.icon_sha256 }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare restricted-userns native desktop
        run: |
          mkdir -p "$RUNNER_TEMP/qa-artifacts" "$RUNNER_TEMP/qa-tools" "$RUNNER_TEMP/qa-release"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox xcompmgr feh imagemagick apparmor libgtk-3-0t64 libnss3 libxss1 libasound2t64 libgbm1 libatk-bridge2.0-0t64 libdrm2 libx11-6
          test "$(uname -m)" = x86_64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          { uname -a; cat /etc/os-release; sysctl kernel.apparmor_restrict_unprivileged_userns; sudo aa-status; } | tee "$RUNNER_TEMP/qa-artifacts/host-policy.txt"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Download private inputs and verify their exact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in "$ASSET_X64" "$ASSET_ARM64" "$ICON_ASSET"; do
            gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP/qa-release"
          done
          for sha in "$SHA256_X64" "$SHA256_ARM64" "$ICON_SHA256"; do [[ "$sha" =~ ^[a-f0-9]{64}$ ]]; done
          printf '%s  %s\n' "$SHA256_X64" "$RUNNER_TEMP/qa-release/$ASSET_X64" "$SHA256_ARM64" "$RUNNER_TEMP/qa-release/$ASSET_ARM64" "$ICON_SHA256" "$RUNNER_TEMP/qa-release/$ICON_ASSET" | sha256sum --check | tee "$RUNNER_TEMP/qa-artifacts/input-sha256.txt"
          tar -xzf "$RUNNER_TEMP/qa-release/$ASSET_X64" -C "$RUNNER_TEMP/qa-release"
          tar -xzf "$RUNNER_TEMP/qa-release/$ASSET_ARM64" -C "$RUNNER_TEMP/qa-release"
          printf '%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$RUNNER_TEMP/qa-artifacts/run-identity.txt"
      - name: Prepare generic Debian and sandbox QA helpers
        run: |
          npm install --prefix "$RUNNER_TEMP/qa-tools" --no-audit --no-fund electron-builder@26.15.3 playwright@1.63.0
          cat > "$RUNNER_TEMP/qa-tools/package-linux-deb.cjs" <<'HELPER_PACKAGE_LINUX_DEB_CJS'
          'use strict';
          // Wrap unchanged prepackaged Electron 0.5.0 bytes in a system-installed Debian package.
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto'), assert = require('node:assert/strict');
          const { build, Platform, Arch } = require('electron-builder');
          const input = path.resolve(process.argv[2]), arch = process.argv[3], output = path.resolve(process.argv[4]), icon = path.resolve(process.argv[5]);
          assert.ok(['x64', 'arm64'].includes(arch), 'Expected x64 or arm64');
          const sha256 = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          (async () => {
            const asar = await import('@electron/asar');
            const archive = path.join(input, 'resources/app.asar');
            const metadata = JSON.parse(asar.extractFile(archive, 'package.json').toString());
            assert.equal(metadata.version, '0.5.0');
            assert.ok(fs.existsSync(path.join(input, 'MischiefPet')));
            const before = sha256(archive), project = path.join(output, 'builder-project-' + arch);
            fs.mkdirSync(project, { recursive: true });
            fs.writeFileSync(path.join(project, 'package.json'), JSON.stringify({ ...metadata, homepage: 'https://mischiefpet.neogenesis.app', author: { name: 'Neo Genesis', email: 'help@neogenesis.app' } }, null, 2));
            const builderRoot = path.dirname(require.resolve('app-builder-lib/package.json'));
            const defaultPostinstall = fs.readFileSync(path.join(builderRoot, 'templates/linux/after-install.tpl'), 'utf8');
            // Keep the stock desktop registration and exact-path AppArmor profile loader.
            // Its root-run unshare probe can select 0755 even when ordinary users are restricted.
            const postinstall = path.join(project, 'after-install.tpl');
            fs.writeFileSync(postinstall, defaultPostinstall + '\n# Installed privileged sandbox fallback; never apply this to user-owned tarballs.\nchown root:root \'/opt/${sanitizedProductName}/chrome-sandbox\'\nchmod 4755 \'/opt/${sanitizedProductName}/chrome-sandbox\'\n');
            const debianArch = arch === 'x64' ? 'amd64' : 'arm64';
            const result = await build({
              projectDir: project, prepackaged: input, targets: Platform.LINUX.createTarget('deb', Arch[arch]),
              config: {
                productName: 'Mischief Pet', electronVersion: '43.7.7', directories: { output },
                linux: { executableName: 'MischiefPet', icon, category: 'Utility', desktop: { entry: { Categories: 'Utility;Amusement;', Comment: 'A playful desktop companion' } } },
                deb: { packageName: 'mischief-pet', maintainer: 'Neo Genesis <help@neogenesis.app>', vendor: 'Neo Genesis', packageCategory: 'utils', afterInstall: postinstall, artifactName: `mischief-pet_${metadata.version}_${debianArch}.deb` }
              }
            });
            assert.equal(sha256(archive), before, 'Prepackaged ASAR must remain byte-identical');
            const files = result.filter(file => file.endsWith('.deb')).map(file => ({ path: file, sha256: sha256(file), bytes: fs.statSync(file).size }));
            assert.equal(files.length, 1);
            fs.writeFileSync(path.join(output, `build-${debianArch}.json`), JSON.stringify({ version: metadata.version, arch, input, asar_sha256_before: before, asar_sha256_after: sha256(archive), electron_builder: require('electron-builder/package.json').version, sandbox_policy: 'Stock AppArmor userns profile and postinst loader; explicit root:root 4755 chrome-sandbox fallback', artifacts: files }, null, 2) + '\n');
            fs.rmSync(project, { recursive: true, force: true });
            console.log(JSON.stringify(files, null, 2));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          HELPER_PACKAGE_LINUX_DEB_CJS
          cat > "$RUNNER_TEMP/qa-tools/linux-sandbox-qa.cjs" <<'HELPER_LINUX_SANDBOX_QA_CJS'
          'use strict';
          // Explicit installed-package QA. No --no-sandbox flag or Chromium sandbox bypass.
          const fs=require('node:fs'),path=require('node:path'),os=require('node:os'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const {execFileSync}=require('node:child_process'),{_electron}=require('playwright');
          const target=path.resolve(process.argv[2]),output=path.resolve(process.argv[3]);
          fs.mkdirSync(output,{recursive:true});
          const temp=fs.mkdtempSync(path.join(os.tmpdir(),'mischief-sandbox-qa-'));
          const receipt={started_at:new Date().toISOString(),platform:process.platform,arch:process.arch,target,profile:temp,checks:[],limitations:['GitHub-hosted Ubuntu 24.04 Xvfb with Openbox and xcompmgr; not a physical desktop.','No Wayland, physical input, multimonitor, suspend/resume or extended soak.','Perch capability checked, not an actual perch jump onto another application.','Manager shown with showInactive; no focus() call.'],screenshots:[]};
          let app,pids=[],crashes=[];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms)),hash=f=>crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          const pass=(name,data)=>receipt.checks.push({name,result:'PASS',data});
          async function capture(page,name){const file=path.join(output,name);await page.screenshot({path:file,omitBackground:true});receipt.screenshots.push({path:file,bytes:fs.statSync(file).size,sha256:hash(file)});}
          (async()=>{
           const env={...process.env};delete env.ELECTRON_RUN_AS_NODE;delete env.ELECTRON_DISABLE_SANDBOX;delete env.CHROME_DEVEL_SANDBOX;
           app=await _electron.launch({executablePath:target,chromiumSandbox:true,args:['--user-data-dir='+temp],env,timeout:60000});
           const pid=app.process().pid;receipt.pid=pid;receipt.launch={argv:app.process().spawnargs,chromiumSandbox:true};
           assert.ok(!receipt.launch.argv.includes('--no-sandbox'));
           await app.firstWindow();let manager,pet;const deadline=Date.now()+30000;
           while(Date.now()<deadline){manager=app.windows().find(w=>w.url().endsWith('/index.html'));pet=app.windows().find(w=>w.url().endsWith('/overlay.html'));if(manager&&pet&&await pet.evaluate(()=>MischiefSprite.ready()).catch(()=>false))break;await sleep(100);}
           assert.ok(manager&&pet,'manager and pet renderer required');await pet.waitForFunction(()=>MischiefSprite.ready());
           app.on('window',page=>page.on('crash',()=>crashes.push(page.url())));for(const page of app.windows())page.on('crash',()=>crashes.push(page.url()));
           const ws=await app.evaluate(({BrowserWindow})=>BrowserWindow.getAllWindows().map(w=>({url:w.webContents.getURL(),visible:w.isVisible(),focusable:w.isFocusable(),bounds:w.getBounds()})));
           assert.ok(ws.find(w=>w.url.endsWith('/overlay.html'))?.visible);pass('Process starts and visible pet renderer loads',ws);
           const initial=await manager.evaluate(()=>petDesktop.getState());
           assert.equal(initial.capabilities.windowOcclusion,true);assert.equal(initial.state.perch.available,true);pass('Native window-world bridge loads; perch is available',{capabilities:initial.capabilities,perch:initial.state.perch});
           await capture(pet,'pet.png');
           await app.evaluate(({BrowserWindow})=>BrowserWindow.getAllWindows().find(w=>w.webContents.getURL().endsWith('/index.html')).showInactive());
           assert.equal(await manager.isVisible('body'),true);await capture(manager,'manager.png');pass('Manager opens without explicit focus',true);
           const before=(await manager.evaluate(()=>petDesktop.getState())).state.foodCounts.salmon||0;
           await manager.locator('#food').selectOption('salmon');await manager.locator('#feed-button').click();
           await manager.waitForFunction(before=>petDesktop.getState().then(s=>(s.state.foodCounts.salmon||0)===before+1),before);
           pass('Care action via manager UI increments salmon count',{before,after:(await manager.evaluate(()=>petDesktop.getState())).state.foodCounts.salmon});
           const samples=[];for(let i=0;i<10;i++){samples.push(await pet.evaluate(()=>document.getElementById('pet').toDataURL()));await sleep(180);}
           assert.ok(new Set(samples).size>1);pass('Pet animation produces changing rendered frames',{distinctFrames:new Set(samples).size,sampleCount:samples.length});
           await sleep(30000);assert.equal(app.process().exitCode,null);assert.deepEqual(crashes,[]);
           const final=await manager.evaluate(()=>petDesktop.getState());assert.ok(final.state.time>initial.state.time);pass('Renderer responsive and no crash over 30 seconds',{initialTime:initial.state.time,finalTime:final.state.time,crashes});
           receipt.sandbox=await app.evaluate(({app})=>{
            const fs=process.getBuiltinModule('fs');
            const info=pid=>{const s=fs.readFileSync(`/proc/${pid}/status`,'utf8');return {pid,seccomp:Number(/^Seccomp:\s+(\d+)/m.exec(s)?.[1]),noNewPrivileges:Number(/^NoNewPrivs:\s+(\d+)/m.exec(s)?.[1]),effectiveCapabilities:/^CapEff:\s+(\w+)/m.exec(s)?.[1],pidNamespace:fs.readlinkSync(`/proc/${pid}/ns/pid`)};};
            return {main:info(process.pid),renderers:app.getAppMetrics().filter(m=>m.type==='Tab').map(m=>({...info(m.pid),sandboxed:m.sandboxed}))};
           });
           assert.ok(receipt.sandbox.renderers.length>=2);
           for(const renderer of receipt.sandbox.renderers){assert.equal(renderer.seccomp,2);assert.equal(renderer.noNewPrivileges,1);assert.match(renderer.effectiveCapabilities,/^0+$/);assert.notEqual(renderer.pidNamespace,receipt.sandbox.main.pidNamespace);}
           pass('Renderer sandbox has seccomp, no-new-privileges, zero capabilities and isolated PID namespace',receipt.sandbox);
           const ps=execFileSync('ps',['-eo','pid,ppid,user,args'],{encoding:'utf8'});
           const rows=ps.trim().split('\n').slice(1).map(line=>{const m=/^\s*(\d+)\s+(\d+)\s+(\S+)\s+(.*)$/.exec(line);return m&&{pid:Number(m[1]),ppid:Number(m[2]),user:m[3],args:m[4]};}).filter(Boolean);
           const family=new Set([pid]);let changed=true;while(changed){changed=false;for(const row of rows)if(family.has(row.ppid)&&!family.has(row.pid)){family.add(row.pid);changed=true;}}
           receipt.processes=rows.filter(row=>family.has(row.pid));assert.ok(receipt.processes.some(row=>row.args.includes('--type=zygote')));assert.ok(receipt.processes.every(row=>!row.args.includes('--no-sandbox')));
           fs.writeFileSync(path.join(output,'processes.json'),JSON.stringify({command:['ps','-eo','pid,ppid,user,args'],application_processes:receipt.processes},null,2)+'\n');
           await capture(manager,'manager-after-care.png');
           const file=path.join(output,'desktop.png'),args=['-display',process.env.DISPLAY,'-window','root',file];execFileSync('import',args);receipt.display_capture={command:['import',...args],path:file,bytes:fs.statSync(file).size,sha256:hash(file)};
           pids=[...family];await app.close();app=null;await sleep(1500);
           const leftovers=pids.filter(pid=>{try{process.kill(pid,0);return true;}catch{return false;}});assert.deepEqual(leftovers,[]);pass('Clean exit leaves no application processes',{pids,leftovers});
           receipt.result='PASS_SANDBOXED';
          })().catch(e=>{receipt.result='FAIL';receipt.error=e.stack;process.exitCode=1;}).finally(async()=>{
           if(app)await app.close().catch(()=>{});fs.rmSync(temp,{recursive:true,force:true});receipt.finished_at=new Date().toISOString();
           fs.writeFileSync(path.join(output,'qa.json'),JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify({result:receipt.result,checks:receipt.checks,error:receipt.error},null,2));
          });
          HELPER_LINUX_SANDBOX_QA_CJS
          cat > "$RUNNER_TEMP/qa-tools/linux-sandbox-baseline.cjs" <<'HELPER_LINUX_SANDBOX_BASELINE_CJS'
          'use strict';
          // Observe ordinary archive startup before installing any per-app sandbox policy.
          const fs=require('node:fs'),path=require('node:path'),os=require('node:os'),crypto=require('node:crypto'),{spawn}=require('node:child_process');
          const executable=path.resolve(process.argv[2]),output=path.resolve(process.argv[3]);
          fs.mkdirSync(output,{recursive:true});const profile=fs.mkdtempSync(path.join(os.tmpdir(),'mischief-archive-baseline-'));
          const args=['--user-data-dir='+profile],env={...process.env};delete env.ELECTRON_RUN_AS_NODE;delete env.ELECTRON_DISABLE_SANDBOX;delete env.CHROME_DEVEL_SANDBOX;
          const receipt={started_at:new Date().toISOString(),command:[executable,...args],profile,chrome_sandbox_mode:(fs.statSync(path.join(path.dirname(executable),'chrome-sandbox')).mode&0o7777).toString(8),sandbox_bypass:false,observation_seconds:20};
          const child=spawn(executable,args,{env,detached:true,stdio:['ignore','pipe','pipe']});let text='',timedOut=false;
          child.stdout.on('data',b=>{text+=b;});child.stderr.on('data',b=>{text+=b;});
          const stop=()=>{try{process.kill(-child.pid,'SIGTERM');}catch{}};
          const timer=setTimeout(()=>{timedOut=true;stop();},20000);
          child.on('error',error=>{receipt.spawn_error=error.message;});
          child.on('close',(code,signal)=>{
           clearTimeout(timer);stop();receipt.exit_code=code;receipt.signal=signal;receipt.survived_observation=timedOut;receipt.result=timedOut?'ALIVE_20_SECONDS':'EXITED_DURING_STARTUP';receipt.output=text;receipt.finished_at=new Date().toISOString();
           const log=path.join(output,'baseline.log');fs.writeFileSync(log,text);receipt.log_sha256=crypto.createHash('sha256').update(text).digest('hex');fs.rmSync(profile,{recursive:true,force:true});fs.writeFileSync(path.join(output,'baseline.json'),JSON.stringify(receipt,null,2)+'\n');console.log(JSON.stringify(receipt,null,2));
          });
          HELPER_LINUX_SANDBOX_BASELINE_CJS
          cat > "$RUNNER_TEMP/qa-tools/openbox.xml" <<'WM_CONFIG'
          <?xml version="1.0"?><openbox_config xmlns="http://openbox.org/3.4/rc"><theme><name>Onyx</name><titleLayout>NLIMC</titleLayout></theme><focus><focusNew>no</focusNew><followMouse>no</followMouse></focus><desktops><number>1</number></desktops></openbox_config>
          WM_CONFIG
          cat > "$RUNNER_TEMP/qa-tools/x11-session.sh" <<'X11_SESSION'
          set -euo pipefail
          ulimit -c 0
          openbox --config-file "$RUNNER_TEMP/qa-tools/openbox.xml" & wm=$!
          xcompmgr -n & compositor=$!
          trap 'kill "$compositor" "$wm" 2>/dev/null || true' EXIT
          sleep 1
          feh --bg-fill "$RUNNER_TEMP/qa-tools/wallpaper.png"
          "$@"
          X11_SESSION
          convert -size 1920x1080 xc:'#E9EFEA' "$RUNNER_TEMP/qa-tools/wallpaper.png"
      - name: Record ordinary original archive startup without any sandbox bypass
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' bash "$RUNNER_TEMP/qa-tools/x11-session.sh" node "$RUNNER_TEMP/qa-tools/linux-sandbox-baseline.cjs" "$RUNNER_TEMP/qa-release/MischiefPet-linux-x64/MischiefPet" "$RUNNER_TEMP/qa-artifacts/archive-baseline"
      - name: Build both Debian architectures sequentially from unchanged prepackaged apps
        id: packages
        run: |
          mkdir -p "$RUNNER_TEMP/qa-artifacts/packages"
          for arch in x64 arm64; do
            node "$RUNNER_TEMP/qa-tools/package-linux-deb.cjs" "$RUNNER_TEMP/qa-release/MischiefPet-linux-$arch" "$arch" "$RUNNER_TEMP/qa-artifacts/packages" "$RUNNER_TEMP/qa-release/$ICON_ASSET" 2>&1 | tee "$RUNNER_TEMP/qa-artifacts/build-$arch.log"
          done
          cp "$RUNNER_TEMP/qa-tools/linux-sandbox-qa.cjs" "$RUNNER_TEMP/qa-tools/openbox.xml" "$RUNNER_TEMP/qa-tools/x11-session.sh" "$RUNNER_TEMP/qa-tools/wallpaper.png" "$RUNNER_TEMP/qa-artifacts/"
          for arch in amd64 arm64; do
            package="$RUNNER_TEMP/qa-artifacts/packages/mischief-pet_0.5.0_$arch.deb"
            mkdir -p "$RUNNER_TEMP/qa-artifacts/control-$arch"
            dpkg-deb -e "$package" "$RUNNER_TEMP/qa-artifacts/control-$arch"
            dpkg-deb -I "$package" > "$RUNNER_TEMP/qa-artifacts/package-info-$arch.txt"
            dpkg-deb -c "$package" > "$RUNNER_TEMP/qa-artifacts/package-files-$arch.txt"
            sha256sum "$package" >> "$RUNNER_TEMP/qa-artifacts/deb-sha256.txt"
          done
          hash=$(sha256sum "$RUNNER_TEMP/qa-artifacts/packages/mischief-pet_0.5.0_arm64.deb")
          printf 'sha256_arm64=%s\n' "${hash%% *}" >> "$GITHUB_OUTPUT"
      - name: Transfer installers through the disposable private draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" "$RUNNER_TEMP/qa-artifacts/packages/mischief-pet_0.5.0_amd64.deb" "$RUNNER_TEMP/qa-artifacts/packages/mischief-pet_0.5.0_arm64.deb"
      - name: Install amd64 Debian package and record the actual sandbox policy
        run: |
          sudo apt-get install -y "$RUNNER_TEMP/qa-artifacts/packages/mischief-pet_0.5.0_amd64.deb" 2>&1 | tee "$RUNNER_TEMP/qa-artifacts/install.log"
          { stat -c '%U:%G %a %n' '/opt/Mischief Pet/chrome-sandbox'; cat /etc/apparmor.d/MischiefPet; sudo aa-status; cat /usr/share/applications/MischiefPet.desktop; sysctl kernel.apparmor_restrict_unprivileged_userns; } | tee "$RUNNER_TEMP/qa-artifacts/installed-policy.txt"
          test "$(stat -c '%u:%g:%a' '/opt/Mischief Pet/chrome-sandbox')" = 0:0:4755
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Run native installed x64 app with the Chromium sandbox enabled
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' bash "$RUNNER_TEMP/qa-tools/x11-session.sh" node "$RUNNER_TEMP/qa-tools/linux-sandbox-qa.cjs" '/opt/Mischief Pet/MischiefPet' "$RUNNER_TEMP/qa-artifacts/runtime" 2>&1 | tee "$RUNNER_TEMP/qa-artifacts/sandboxed-qa.log"
      - name: Remove installed package and verify system integration cleanup
        if: always()
        run: |
          if [ "$(dpkg-query -W -f='${Status}' mischief-pet 2>/dev/null)" = 'install ok installed' ]; then sudo apt-get remove -y mischief-pet; fi
          test ! -e '/opt/Mischief Pet/MischiefPet'
          test ! -e /etc/apparmor.d/MischiefPet
          test ! -e /usr/share/applications/MischiefPet.desktop
          printf '%s\n' 'apt remove completed; executable, AppArmor profile and desktop entry absent' | tee "$RUNNER_TEMP/qa-artifacts/uninstall.txt"
      - name: Upload installers and evidence only; never publish a release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-x64-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qa-artifacts/
            !${{ runner.temp }}/qa-artifacts/packages/*.deb
          if-no-files-found: error
          retention-days: 7
  native-arm64:
    needs: native-x64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb-x64-${{ github.run_id }}
          path: ${{ runner.temp }}/qa-input/
      - name: Prepare native arm64 restricted-userns desktop
        run: |
          mkdir -p "$RUNNER_TEMP/qa-artifacts" "$RUNNER_TEMP/qa-tools"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox xcompmgr feh imagemagick apparmor libgtk-3-0t64 libnss3 libxss1 libasound2t64 libgbm1 libatk-bridge2.0-0t64 libdrm2 libx11-6
          test "$(uname -m)" = aarch64
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          { uname -a; cat /etc/os-release; sysctl kernel.apparmor_restrict_unprivileged_userns; sudo aa-status; } | tee "$RUNNER_TEMP/qa-artifacts/host-policy.txt"
          cp "$RUNNER_TEMP/qa-input/linux-sandbox-qa.cjs" "$RUNNER_TEMP/qa-input/openbox.xml" "$RUNNER_TEMP/qa-input/x11-session.sh" "$RUNNER_TEMP/qa-input/wallpaper.png" "$RUNNER_TEMP/qa-tools/"
          npm install --prefix "$RUNNER_TEMP/qa-tools" --no-audit --no-fund playwright@1.63.0
      - name: Download private arm64 installer and verify cross-job identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA256: ${{ needs.native-x64.outputs.sha256_arm64 }}
        run: |
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --pattern 'mischief-pet_0.5.0_arm64.deb' --dir "$RUNNER_TEMP/qa-input/packages"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/qa-input/packages/mischief-pet_0.5.0_arm64.deb" | sha256sum --check | tee "$RUNNER_TEMP/qa-artifacts/private-input-sha256.txt"
      - name: Install arm64 Debian package and record actual sandbox policy
        run: |
          sha256sum "$RUNNER_TEMP/qa-input/packages/mischief-pet_0.5.0_arm64.deb" | tee "$RUNNER_TEMP/qa-artifacts/deb-sha256.txt"
          sudo apt-get install -y "$RUNNER_TEMP/qa-input/packages/mischief-pet_0.5.0_arm64.deb" 2>&1 | tee "$RUNNER_TEMP/qa-artifacts/install.log"
          { stat -c '%U:%G %a %n' '/opt/Mischief Pet/chrome-sandbox'; cat /etc/apparmor.d/MischiefPet; sudo aa-status; cat /usr/share/applications/MischiefPet.desktop; sysctl kernel.apparmor_restrict_unprivileged_userns; } | tee "$RUNNER_TEMP/qa-artifacts/installed-policy.txt"
          test "$(stat -c '%u:%g:%a' '/opt/Mischief Pet/chrome-sandbox')" = 0:0:4755
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Run native installed arm64 app with the Chromium sandbox enabled
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' bash "$RUNNER_TEMP/qa-tools/x11-session.sh" node "$RUNNER_TEMP/qa-tools/linux-sandbox-qa.cjs" '/opt/Mischief Pet/MischiefPet' "$RUNNER_TEMP/qa-artifacts/runtime" 2>&1 | tee "$RUNNER_TEMP/qa-artifacts/sandboxed-qa.log"
      - name: Remove installed arm64 package cleanly
        if: always()
        run: |
          if [ "$(dpkg-query -W -f='${Status}' mischief-pet 2>/dev/null)" = 'install ok installed' ]; then sudo apt-get remove -y mischief-pet; fi
          test ! -e '/opt/Mischief Pet/MischiefPet'
          test ! -e /etc/apparmor.d/MischiefPet
          test ! -e /usr/share/applications/MischiefPet.desktop
          printf '%s\n' 'apt remove completed; executable, AppArmor profile and desktop entry absent' | tee "$RUNNER_TEMP/qa-artifacts/uninstall.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-deb-arm64-${{ github.run_id }}
          path: ${{ runner.temp }}/qa-artifacts/
          if-no-files-found: error
          retention-days: 7
