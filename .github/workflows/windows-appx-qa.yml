name: Manual Windows AppX sideload QA
# Private draft input only. This workflow never publishes and never uploads an AppX, certificate, or private key.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact private draft release tag holding the unsigned QA AppX
        required: true
        type: string
      appx_asset:
        description: Exact private draft asset filename ending in .appx
        required: true
        type: string
      appx_sha256:
        description: Exact lowercase SHA256 of the AppX asset
        required: true
        type: string
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: pwsh
env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  APPX_ASSET: ${{ inputs.appx_asset }}
  APPX_SHA256: ${{ inputs.appx_sha256 }}
  ACCEPTED_ASAR_SHA256: 396a6303f5a5843dd325b596be584e12e3a1c03941bb22e85fe22104a260c1fe
  ACCEPTED_NATIVE_SHA256: dcb3048bba5cf115aa19172f091cf005f8be9d39fd42dfb5ea25103318784a44
jobs:
  windows-appx-qa:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Materialize runner-only QA harness
        id: harness
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mischief-appx-qa'
