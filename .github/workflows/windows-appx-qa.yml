          '@
          $scriptPath = Join-Path $root 'qa-windows-appx.ps1'
          [IO.File]::WriteAllBytes($scriptPath, [Convert]::FromBase64String(($encoded -replace '\s','')))
          "QA_SCRIPT=$scriptPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QA_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run actual signed sideload QA
        id: qa
        continue-on-error: true
        run: |
          & $env:QA_SCRIPT -ReleaseTag $env:RELEASE_TAG -AppxAsset $env:APPX_ASSET -AppxSha256 $env:APPX_SHA256 -EvidenceDirectory $env:QA_EVIDENCE
          $exit = $LASTEXITCODE
          if ($exit -ne 0) { Write-Error "QA result is not PASS (exit $exit)"; exit $exit }
      - name: Upload QA receipts, screenshots, and WACK report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mischief-pet-windows-appx-qa-${{ github.run_id }}
          path: ${{ env.QA_EVIDENCE }}
          if-no-files-found: error
          retention-days: 7
      - name: Enforce QA result
        if: always()
        run: |
          $result = Join-Path $env:QA_EVIDENCE 'result.json'
          if (-not (Test-Path $result)) { throw 'QA result.json is missing' }
          $json = Get-Content $result -Raw | ConvertFrom-Json
          if ($json.result -ne 'PASS') { throw "QA result: $($json.result)" }
